name: Deploy HRMS Backend to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Azure Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'azureuser' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "?? Starting HRMS Backend deployment..."
            cd /opt/Api_Backends/Tibos-Hrm/HRMS_Backend
            git pull origin main
            if [ -d "venv" ]; then
              source venv/bin/activate
            elif [ -d ".venv" ]; then
              source .venv/bin/activate
            fi
            pip install -r requirements.txt
            sudo systemctl restart TibosHrm
            echo "? HRMS Backend deployment successful!"
